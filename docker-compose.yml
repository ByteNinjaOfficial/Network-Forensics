services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command: ["python", "-m", "backend.cli", "--host", "0.0.0.0", "--port", "8000"]

  dashboard:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    environment:
      - VITE_API_URL=http://127.0.0.1:8000
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev"]
    depends_on:
      - api
